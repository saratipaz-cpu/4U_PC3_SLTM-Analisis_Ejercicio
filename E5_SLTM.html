<!DOCTYPE html>
<html lang="en">
<head>
    <!--Configuracion general-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla con caption</title>
</head>
<body>
    <!--Tabla con borde-->
    <!--Creacion de la tabla-->
    <table border="1">
        <!--Se usa para colocar un titulo de a la tabla-->
        <caption>Población de los países con mayor cantidad de habitantes</caption>
        <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las dos celdas dentro de la fila-->
            <th>Paises</th><th>Cantidad de Habitantes</th>
        </tr>
        <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las dos celdas dentro de la fila-->
            <td>China</td><td>1300 millones</td>
        </tr>
        <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las dos celdas dentro de la fila-->
            <td>India</td><td>1080 millones</td>
        </tr>
        <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las dos celdas dentro de la fila-->
            <td>Estados Unidos</td><td>295 millones</td>
        </tr>
</body>
</html>
