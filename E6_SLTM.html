<!DOCTYPE html>
<html lang="en">
<head>
    <!--Configuracion general-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla y combinación de celdas</title>
</head>
<body>
    <!--Tabla con borde-->
    <!--Creacion de la tabla-->
    <table border="1">
        <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las dos celdas dentro de la fila-->
            <!--rowspan permite que la celda se extienda a varias filas de forma vertical-->
            <td rowspan="4">Recursos</td>
            <!--colspan permite que la celda se extienda a varias filas de forma horizontal-->
            <td colspan="4">Facturación de los últimos meses</td>
        </tr>
         <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las cuatro celdas dentro de la fila-->
            <td>Discos Duros</td><td>23000</td><td>27200</td><td>26000</td>
        </tr>
         <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las cuatro celdas dentro de la fila-->
            <td>CPU</td><td>73000</td><td>67300</td><td>51000</td>
        </tr>
         <!--Crea una fila dentro de la tabla-->
        <tr>
            <!--Define las cuatro celdas dentro de la fila-->
            <td>Monitores</td><td>53000</td><td>72000</td><td>88000</td>
        </tr>
    </table>
</body>
</html>
